<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stitch Draw</title>
<!-- Standalone Draw mode (#106). The app shell (#105) mounts the same module: import { mountDraw } from './draw/draw.js'.
     Serve over http (module worker): python -m http.server 8000 --directory web, then open /draw/ -->
<link rel="stylesheet" href="draw.css">
<style>body { margin: 0; padding: 16px 24px; background: var(--bg); color: var(--ink); font: 12px/1.4 var(--font-mono); }
h1 { font: 600 22px/1 var(--font-cond); letter-spacing: .2em; text-transform: uppercase; margin: 0 0 4px; }
.sub { font: italic 13px var(--font-serif); color: var(--dim); margin: 0 0 12px; }</style>
</head>
<body>
<h1>Stitch</h1>
<p class="sub">Draw mode · research use only, not for diagnosis or treatment</p>
<main id="draw"></main>
<script type="module">
import { mountDraw } from './draw.js';
mountDraw(document.getElementById('draw'));
</script>
</body>
</html>
